name: Action

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: action-${{ github.ref }}
  cancel-in-progress: true

jobs:
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Action con el fixture (sin red)
        id: fixture
        uses: ./
        with:
          user: ""
          fixture: testdata/events.json
          out: out/fixture.svg

      - name: Action con la especie hongo (sin red)
        id: mushroom
        uses: ./
        with:
          user: ""
          fixture: testdata/events.json
          species: mushroom
          out: out/mushroom.svg

      - name: Una especie inválida falla con un error claro
        id: invalid
        continue-on-error: true
        uses: ./
        with:
          user: ""
          fixture: testdata/events.json
          species: dragon
          out: out/invalid.svg

      - name: Action con el usuario real
        id: real
        uses: ./
        with:
          out: out/real-dark.svg
          theme: dark

      # keep-on-error (activada por defecto) solo conserva el SVG ante fallos
      # transitorios (red, 5xx, límite de peticiones), que cubren los tests de
      # la CLI. Un 401 (token inválido) es permanente: debe fallar aunque haya
      # un SVG previo, y dejar ese archivo intacto.
      - name: Preparar un SVG previo
        env:
          FIXTURE_PATH: ${{ steps.fixture.outputs.path }}
        run: cp "$FIXTURE_PATH" out/keep.svg

      - name: Un 401 falla aunque haya SVG previo
        id: unauthorized
        continue-on-error: true
        uses: ./
        with:
          token: no-es-un-token
          out: out/keep.svg

      - name: Un valor inválido de keep-on-error falla con un error claro
        id: badkeep
        continue-on-error: true
        uses: ./
        with:
          user: ""
          fixture: testdata/events.json
          keep-on-error: quizas
          out: out/badkeep.svg

      - name: Comprobar los SVG
        env:
          FIXTURE_PATH: ${{ steps.fixture.outputs.path }}
          MUSHROOM_PATH: ${{ steps.mushroom.outputs.path }}
          REAL_PATH: ${{ steps.real.outputs.path }}
          INVALID_OUTCOME: ${{ steps.invalid.outcome }}
          UNAUTHORIZED_OUTCOME: ${{ steps.unauthorized.outcome }}
          BADKEEP_OUTCOME: ${{ steps.badkeep.outcome }}
        run: |
          set -euo pipefail
          test "$INVALID_OUTCOME" = failure || { echo 'species: dragon debería fallar'; exit 1; }
          test ! -e out/invalid.svg
          test "$UNAUTHORIZED_OUTCOME" = failure || { echo 'un 401 debería fallar aunque haya SVG previo'; exit 1; }
          test "$BADKEEP_OUTCOME" = failure || { echo 'keep-on-error: quizas debería fallar'; exit 1; }
          test ! -e out/badkeep.svg
          cmp out/keep.svg "$FIXTURE_PATH" || { echo 'el SVG previo cambió'; exit 1; }
          for f in "$FIXTURE_PATH" "$MUSHROOM_PATH" "$REAL_PATH"; do
            test -s "$f"
            head -c 120 "$f"; echo
            grep -q '</svg>' "$f"
          done
          grep -q '@octoexample' "$FIXTURE_PATH"
          grep -q 'Retoño' "$FIXTURE_PATH"
          grep -q 'Seta' "$MUSHROOM_PATH"
          if grep -q 'Retoño' "$MUSHROOM_PATH"; then echo 'la especie hongo no se aplicó'; exit 1; fi
          grep -q "@${{ github.repository_owner }}" "$REAL_PATH"
          grep -q '#2b2724' "$REAL_PATH"
