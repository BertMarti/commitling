name: Release

# Uploads the precompiled binaries to a release when it is published. It only
# runs then (nothing here creates releases or moves tags). The binaries are
# rebuilt from the tag with scripts/build-release.sh and must match the
# release/checksums.txt committed in that tag: that file is what the Action
# trusts. Without it, nothing is uploaded and the Action keeps compiling with
# go run.
#
# Each binary also gets a signed build provenance attestation (Sigstore, free
# for public repositories), only so that people can check a binary they
# downloaded by hand: gh attestation verify <binary> --repo BertMarti/commitling.
# The Action does not use attestations (they would need a token and gh): it
# still trusts only release/checksums.txt of its own tree.
on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  binaries:
    name: binarios
    runs-on: ubuntu-latest
    # contents: upload the binaries to the release; id-token: the OIDC token
    # that Sigstore turns into the short-lived signing certificate;
    # attestations: store the attestation in this repository.
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Comprobar la versión y release/checksums.txt
        id: check
        run: |
          set -euo pipefail
          version="$(sed -n 's/^var version = "\(.*\)"$/\1/p' cmd/commitling/main.go)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::La etiqueta $TAG no coincide con la versión de la CLI (v$version)."
            exit 1
          fi
          if [ ! -f release/checksums.txt ]; then
            echo "::warning::$TAG no tiene release/checksums.txt: no se suben binarios y la Action seguirá compilando con go run."
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "upload=true" >> "$GITHUB_OUTPUT"

      - name: Compilar y verificar los binarios
        if: steps.check.outputs.upload == 'true'
        run: scripts/build-release.sh "$RUNNER_TEMP/dist" --check

      # Only after --check: what gets attested is exactly what
      # release/checksums.txt lists (same names and SHA-256).
      - name: Atestar la procedencia de los binarios
        if: steps.check.outputs.upload == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/dist/checksums.txt

      - name: Subir los binarios a la release
        if: steps.check.outputs.upload == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$RUNNER_TEMP"/dist/commitling_* "$RUNNER_TEMP/dist/checksums.txt" --clobber
          {
            echo "### Binarios de $TAG"
            echo '```'
            cat "$RUNNER_TEMP/dist/checksums.txt"
            echo '```'
            echo "Cada binario tiene una atestación de procedencia: \`gh attestation verify <binario> --repo $GH_REPO\`."
          } >> "$GITHUB_STEP_SUMMARY"
