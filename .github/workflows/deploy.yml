name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *" # cada día a las 06:17 UTC

# Least privilege: nothing by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

env:
  LIVE_USER: BertMarti

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Galería
        run: go run ./cmd/commitling gallery --out site

      # The live generator: the same Go code as the CLI, compiled to WebAssembly.
      # wasm_exec.js must come from the same Go that compiles the wasm. Neither
      # file is in the repository.
      - name: Generador (WebAssembly)
        run: |
          GOOS=js GOARCH=wasm go build -trimpath -ldflags="-s -w" -o site/commitling.wasm ./cmd/wasm
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" site/wasm_exec.js
          echo "commitling.wasm: $(wc -c < site/commitling.wasm) bytes, $(gzip -9 -c site/commitling.wasm | wc -c) gzipped" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Criatura en vivo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p site/live
          go build -o "$RUNNER_TEMP/commitling" ./cmd/commitling
          cl="$RUNNER_TEMP/commitling"
          if "$cl" render --user "$LIVE_USER" --out "site/live/$LIVE_USER.svg" \
             && "$cl" render --user "$LIVE_USER" --theme dark --out "site/live/$LIVE_USER-dark.svg"; then
            echo "Criatura en vivo de @$LIVE_USER generada con datos reales." >> "$GITHUB_STEP_SUMMARY"
          else
            # The API failed: keep the site alive with the fictitious fixture
            # (the card then says @octoexample, so it is not passed off as real).
            echo "::warning::No se pudo leer la API de GitHub; la criatura en vivo usa el fixture de ejemplo."
            echo "⚠️ API de GitHub no disponible: la criatura en vivo usa el fixture de ejemplo (@octoexample)." >> "$GITHUB_STEP_SUMMARY"
            "$cl" render --fixture testdata/events.json --out "site/live/$LIVE_USER.svg"
            "$cl" render --fixture testdata/events.json --theme dark --out "site/live/$LIVE_USER-dark.svg"
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
