name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Archivos sin formatear:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      # The browser build: it must compile, its layer over internal/generate is
      # tested inside a real WebAssembly runtime (Node, preinstalled on the
      # runner) and its weight is shown in the log.
      - name: wasm
        if: runner.os == 'Linux'
        run: |
          GOOS=js GOARCH=wasm go vet ./cmd/wasm
          GOOS=js GOARCH=wasm go test -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec" ./cmd/wasm
          GOOS=js GOARCH=wasm go build -ldflags="-s -w" -o out/commitling.wasm ./cmd/wasm
          echo "commitling.wasm: $(wc -c < out/commitling.wasm) bytes, $(gzip -9 -c out/commitling.wasm | wc -c) gzipped"

      - name: render con el fixture
        run: |
          go run ./cmd/commitling render --fixture testdata/events.json --out out/commitling.svg
          go run ./cmd/commitling render --fixture testdata/events.json --theme dark --out out/commitling-dark.svg
          test -s out/commitling.svg
          test -s out/commitling-dark.svg

      - name: galería
        run: |
          go run ./cmd/commitling gallery --out out/site
          test -s out/site/index.html
          ls out/site/svg | wc -l

      - name: versión
        run: go run ./cmd/commitling version
