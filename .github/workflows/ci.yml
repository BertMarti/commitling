name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Archivos sin formatear:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      # The browser build: it must compile, its layer over internal/generate is
      # tested inside a real WebAssembly runtime (Node, preinstalled on the
      # runner) and its weight is shown in the log.
      - name: wasm
        if: runner.os == 'Linux'
        run: |
          GOOS=js GOARCH=wasm go vet ./cmd/wasm
          GOOS=js GOARCH=wasm go test -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec" ./cmd/wasm
          GOOS=js GOARCH=wasm go build -trimpath -ldflags="-s -w" -o out/commitling.wasm ./cmd/wasm
          echo "commitling.wasm: $(wc -c < out/commitling.wasm) bytes, $(gzip -9 -c out/commitling.wasm | wc -c) gzipped"
          # Budget: v0.7.0 left it at about 2.56 MB; the 4.6 MB of v0.6.0 must not come back.
          test "$(wc -c < out/commitling.wasm)" -lt 3000000

      - name: render con el fixture
        run: |
          go run ./cmd/commitling render --fixture testdata/events.json --out out/commitling.svg
          go run ./cmd/commitling render --fixture testdata/events.json --theme dark --out out/commitling-dark.svg
          test -s out/commitling.svg
          test -s out/commitling-dark.svg

      - name: galería
        run: |
          go run ./cmd/commitling gallery --out out/site
          test -s out/site/index.html
          find out/site/svg -type f | wc -l

      - name: versión
        run: go run ./cmd/commitling version

      # The Action trusts release/checksums.txt: if it is committed, it must
      # still be what this tree compiles to (reproducible build), or the
      # Action would refuse the release binaries.
      - name: binarios de release reproducibles
        if: runner.os == 'Linux'
        run: |
          if [ -f release/checksums.txt ]; then
            scripts/build-release.sh out/rel --check
          else
            scripts/build-release.sh out/rel
            echo "Sin release/checksums.txt: la Action compila con go run (los SHA-256 de arriba son los de este commit)."
          fi
          # The environment cannot change the bytes (build-release.sh resets
          # GOFLAGS and GOEXPERIMENT; -tags would be recorded in the binary).
          GOFLAGS=-tags=zzz scripts/build-release.sh out/rel-env
          diff -u out/rel/checksums.txt out/rel-env/checksums.txt

      # Every workflow that the web generator and `commitling workflow` can
      # produce (the web builds the same bytes; a test compares them) must be
      # a valid GitHub Actions workflow that uses @v1: actionlint (official
      # binary, pinned SHA-256) also runs shellcheck on its `run:` script.
      - name: workflows generados (actionlint)
        if: runner.os == 'Linux'
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/commitling" ./cmd/commitling
          mkdir -p out/wf
          "$RUNNER_TEMP/commitling" workflow > out/wf/base.yml 2>/dev/null
          for sp in moss mushroom cactus pumpkin; do for th in light dark both; do for sz in full compact; do
            "$RUNNER_TEMP/commitling" workflow --user octocat --species "$sp" --theme "$th" --size "$sz" > "out/wf/$sp-$th-$sz.yml" 2>/dev/null
          done; done; done
          if grep -L 'uses: BertMarti/commitling@v1$' out/wf/*.yml | grep .; then echo "sin @v1"; exit 1; fi
          if grep -l 'commitling@main' out/wf/*.yml; then echo "con @main"; exit 1; fi
          tgz="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tgz" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tgz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tgz" -C "$RUNNER_TEMP" actionlint
          command -v shellcheck
          "$RUNNER_TEMP/actionlint" -color out/wf/*.yml .github/workflows/*.yml
          echo "$(find out/wf -name "*.yml" | wc -l) workflows generados válidos"

  # Security checks: known vulnerabilities in Go and its standard library
  # (govulncheck), static analysis (staticcheck, also for the wasm build) and
  # secrets in the whole history and the working tree (gitleaks, official
  # binary checked against a pinned SHA-256).
  security:
    name: seguridad
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
      GOVULNCHECK_VERSION: "v1.9.0"
      STATICCHECK_VERSION: "2026.2.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: govulncheck
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

      - name: staticcheck
        run: |
          go install "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}"
          "$(go env GOPATH)/bin/staticcheck" ./...
          GOOS=js GOARCH=wasm "$(go env GOPATH)/bin/staticcheck" ./cmd/wasm

      - name: gitleaks
        run: |
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tgz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner -v
          "$RUNNER_TEMP/gitleaks" dir . --redact --no-banner -v
