<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="bn-title bn-desc">
<title id="bn-title">commitling: tu mascota pixel-art que crece con tus commits</title>
<desc id="bn-desc">La palabra commitling sobre fondo de papel y, a la derecha, las cinco fases del brote de musgo dibujadas con los mismos sprites que la Action: semilla, brote, retoño, arbusto y árbol ancestral.</desc>
