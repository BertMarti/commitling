name: commitling
description: Dibuja una mascota pixel-art que crece con tu actividad pública de GitHub (SVG animado para tu README).
author: BertMarti
branding:
  icon: feather
  color: green

inputs:
  user:
    description: Usuario de GitHub cuya actividad pública se dibuja.
    required: false
    default: ${{ github.repository_owner }}
  out:
    description: Ruta del SVG de salida, relativa al repositorio.
    required: false
    default: commitling.svg
  theme:
    description: Tema de la tarjeta, light (papel) o dark (tinta).
    required: false
    default: light
  token:
    description: Token para la API de GitHub. Basta con el GITHUB_TOKEN del workflow.
    required: false
    default: ${{ github.token }}
  species:
    description: Especie de la criatura, moss (brote de musgo, la predeterminada) o mushroom (hongo).
    required: false
    default: moss
  fixture:
    description: Archivo JSON de eventos (relativo al repositorio) para trabajar sin red. Si se indica, no se llama a la API.
    required: false
    default: ""

outputs:
  path:
    description: Ruta absoluta del SVG generado.
    value: ${{ steps.render.outputs.path }}

runs:
  using: composite
  steps:
    # github.action_path is read from the environment on purpose: inside a
    # composite action it is only reliable in `run` steps.
    - id: paths
      shell: bash
      run: echo "gomod=$GITHUB_ACTION_PATH/go.mod" >> "$GITHUB_OUTPUT"

    - uses: actions/setup-go@v7
      with:
        go-version-file: ${{ steps.paths.outputs.gomod }}
        cache: false

    - id: render
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        CL_USER: ${{ inputs.user }}
        CL_OUT: ${{ inputs.out }}
        CL_THEME: ${{ inputs.theme }}
        CL_SPECIES: ${{ inputs.species }}
        CL_FIXTURE: ${{ inputs.fixture }}
      run: |
        set -euo pipefail
        abs() { case "$1" in /*|[A-Za-z]:*) printf '%s' "$1" ;; *) printf '%s/%s' "$GITHUB_WORKSPACE" "$1" ;; esac; }
        out="$(abs "$CL_OUT")"
        args=(render --theme "$CL_THEME" --species "$CL_SPECIES" --out "$out")
        if [ -n "$CL_FIXTURE" ]; then
          args+=(--fixture "$(abs "$CL_FIXTURE")")
          if [ -n "$CL_USER" ]; then args+=(--user "$CL_USER"); fi
        else
          args+=(--user "$CL_USER")
        fi
        cd "$GITHUB_ACTION_PATH"
        go run ./cmd/commitling "${args[@]}"
        echo "path=$out" >> "$GITHUB_OUTPUT"
