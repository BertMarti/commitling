name: commitling
description: Dibuja una mascota pixel-art que crece con tu actividad pública de GitHub (SVG animado para tu README).
author: BertMarti
branding:
  icon: feather
  color: green

inputs:
  user:
    description: Usuario de GitHub cuya actividad pública se dibuja.
    required: false
    default: ${{ github.repository_owner }}
  out:
    description: Ruta del SVG de salida, relativa al repositorio.
    required: false
    default: commitling.svg
  theme:
    description: Tema de la tarjeta, light (papel) o dark (tinta).
    required: false
    default: light
  token:
    description: Token para la API de GitHub. Basta con el GITHUB_TOKEN del workflow.
    required: false
    default: ${{ github.token }}
  species:
    description: Especie de la criatura, moss (brote de musgo, la predeterminada), mushroom (hongo) o cactus.
    required: false
    default: moss
  size:
    description: Tamaño de la tarjeta, full (480x200, la de siempre) o compact (insignia de 200x60 para firmas y barras laterales).
    required: false
    default: full
  fixture:
    description: Archivo JSON de eventos (relativo al repositorio) para trabajar sin red. Si se indica, no se llama a la API.
    required: false
    default: ""
  keep-on-error:
    description: Ante un fallo transitorio de la API (red, 5xx, límite de peticiones), conserva el SVG de salida existente y avisa (true o false).
    required: false
    default: "true"

outputs:
  path:
    description: Ruta absoluta del SVG generado.
    value: ${{ steps.render.outputs.path }}

runs:
  using: composite
  steps:
    # github.action_path is read from the environment on purpose: inside a
    # composite action it is only reliable in `run` steps.
    - id: paths
      shell: bash
      run: echo "gomod=$GITHUB_ACTION_PATH/go.mod" >> "$GITHUB_OUTPUT"

    # Precompiled binary of a release, only if this very tree lists its
    # SHA-256 in release/checksums.txt (scripts/build-release.sh --write) and
    # the download matches it. Otherwise (no file, unknown platform, no
    # release yet, network error, mismatch) path stays empty and the Action
    # compiles with go run, as it always did. Never fails the job.
    # COMMITLING_RELEASE_URL only exists for the Action's own CI test; the
    # binary must still match the committed checksum.
    - id: bin
      shell: bash
      run: |
        sums="$GITHUB_ACTION_PATH/release/checksums.txt"
        [ -f "$sums" ] || exit 0
        case "${RUNNER_OS:-}" in Linux) os=linux ;; macOS) os=darwin ;; Windows) os=windows ;; *) exit 0 ;; esac
        case "${RUNNER_ARCH:-}" in X64) arch=amd64 ;; ARM64) arch=arm64 ;; *) exit 0 ;; esac
        line="$(grep -E "^[0-9a-f]{64}  commitling_[0-9A-Za-z.+-]+_${os}_${arch}(\.exe)?$" "$sums" | head -n 1 || true)"
        [ -n "$line" ] || exit 0
        want="${line%%  *}"
        name="${line#*  }"
        version="${name#commitling_}"
        version="${version%%_*}"
        dir="${RUNNER_TEMP:-/tmp}/commitling-bin"
        mkdir -p "$dir"
        base="${COMMITLING_RELEASE_URL:-https://github.com/BertMarti/commitling/releases/download}"
        if ! curl -fsSL --retry 2 --connect-timeout 10 --max-time 120 -o "$dir/$name" "$base/v$version/$name"; then
          rm -f "$dir/$name"
          echo "::notice::commitling: no hay binario precompilado de v$version para $os/$arch; se compila con Go."
          exit 0
        fi
        if command -v sha256sum >/dev/null 2>&1; then got="$(sha256sum "$dir/$name")"; else got="$(shasum -a 256 "$dir/$name")"; fi
        got="${got%% *}"
        if [ "$got" != "$want" ]; then
          rm -f "$dir/$name"
          echo "::warning::commitling: el binario descargado de v$version no coincide con release/checksums.txt; se descarta y se compila con Go."
          exit 0
        fi
        chmod +x "$dir/$name"
        echo "path=$dir/$name" >> "$GITHUB_OUTPUT"

    - if: steps.bin.outputs.path == ''
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ${{ steps.paths.outputs.gomod }}
        cache: false

    - id: render
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        CL_USER: ${{ inputs.user }}
        CL_OUT: ${{ inputs.out }}
        CL_THEME: ${{ inputs.theme }}
        CL_SPECIES: ${{ inputs.species }}
        CL_SIZE: ${{ inputs.size }}
        CL_FIXTURE: ${{ inputs.fixture }}
        CL_KEEP_ON_ERROR: ${{ inputs.keep-on-error }}
        CL_BIN: ${{ steps.bin.outputs.path }}
      run: |
        set -euo pipefail
        # Defence in depth: GitHub already hides secrets and github.token in
        # the logs, but not a token pasted as plain text into `token:`.
        # A workflow command is one line: mask the token without line breaks
        # (a token pasted with a trailing newline would leave a part unmasked).
        if [ -n "${GITHUB_TOKEN:-}" ]; then printf '::add-mask::%s\n' "${GITHUB_TOKEN//[$'\r\n']/}"; fi
        abs() { case "$1" in /*|[A-Za-z]:*) printf '%s' "$1" ;; *) printf '%s/%s' "$GITHUB_WORKSPACE" "$1" ;; esac; }
        out="$(abs "$CL_OUT")"
        args=(render --theme "$CL_THEME" --species "$CL_SPECIES" --size "$CL_SIZE" --out "$out")
        if [ -n "$CL_FIXTURE" ]; then
          args+=(--fixture "$(abs "$CL_FIXTURE")")
          if [ -n "$CL_USER" ]; then args+=(--user "$CL_USER"); fi
        else
          args+=(--user "$CL_USER")
        fi
        # Composite inputs are always strings: accept only true or false.
        case "$CL_KEEP_ON_ERROR" in
          true) args+=(--keep-on-error) ;;
          false) ;;
          *) echo "::error::keep-on-error debe ser true o false, no '$CL_KEEP_ON_ERROR'"; exit 2 ;;
        esac
        cd "$GITHUB_ACTION_PATH"
        if [ -n "$CL_BIN" ]; then
          "$CL_BIN" "${args[@]}"
        else
          go run ./cmd/commitling "${args[@]}"
        fi
        echo "path=$out" >> "$GITHUB_OUTPUT"
